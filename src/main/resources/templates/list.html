<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Taskify</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <h1>Taskify</h1>
        <p class="subtitle">Simple task manager</p>
    </header>

    <main>
        <div class="toolbar">
            <a href="/new" class="btn">+ Add task</a>
            <nav class="filters">
                <a th:href="@{/(status='all')}" th:classappend="${status == 'all'} ? 'active' : ''" class="filter-link">All</a>
                <a th:href="@{/(status='pending')}" th:classappend="${status == 'pending'} ? 'active' : ''" class="filter-link">Pending</a>
                <a th:href="@{/(status='done')}" th:classappend="${status == 'done'} ? 'active' : ''" class="filter-link">Done</a>
            </nav>
        </div>

        <div th:if="${#lists.isEmpty(tasks)}" class="empty">
            <p>No tasks yet.</p>
        </div>

        <table th:unless="${#lists.isEmpty(tasks)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Detail</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${tasks}" th:classappend="${task.done} ? 'done' : ''">
                    <td th:text="${task.id}">1</td>
                    <td th:text="${task.title}">Sample task</td>
                    <td th:text="${task.showDetail()}">[Type] details</td>
                    <td th:text="${task.done} ? 'Done' : 'Pending'">Pending</td>
                    <td class="row-actions">
                        <form th:if="${task instanceof T(com.taskify.domain.Remindable) and !task.done}"
                              th:action="@{'/tasks/' + ${task.id} + '/reminder'}"
                              method="post" class="inline-form reminder-form">
                            <input type="text" name="time" placeholder="HH:MM" required>
                            <button type="submit" class="btn btn-secondary">Set</button>
                        </form>
                        <form th:unless="${task.done}" th:action="@{'/tasks/' + ${task.id} + '/done'}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-success">Mark done</button>
                        </form>
                        <form th:action="@{'/tasks/' + ${task.id} + '/delete'}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
